# Registry Schema: Stability and Drift Detection (FR-009)

# This schema defines the structure of the internal spec (registry.yaml)
# used to stabilize the Postman collection.

type: object
required:
  - version
  - resources
properties:
  version:
    type: string
    pattern: '^\d+\.\d+\.\d+$'
  resources:
    type: object
    additionalProperties:
      $ref: '#/definitions/Resource'

definitions:
  Resource:
    type: object
    properties:
      endpoints:
        type: object
        additionalProperties:
          $ref: '#/definitions/Endpoint'
      sub_resources:
        type: object
        additionalProperties:
          $ref: '#/definitions/Resource'

  Endpoint:
    type: object
    required:
      - postman_id
      - method
      - path
    properties:
      postman_id:
        type: string
      method:
        type: string
        enum: [GET, POST, PUT, DELETE, PATCH]
      path:
        type: string
      stability:
        type: string
        enum: [Stable, Experimental, Deprecated]
        default: Experimental
      query_params:
        type: array
        description: Query parameters for this endpoint (disabled property omitted as it's Postman-specific)
        items:
          $ref: '#/definitions/QueryParameter'
      pagination:
        $ref: '#/definitions/PaginationMapping'
      response:
        $ref: '#/definitions/ResponseMapping'

  QueryParameter:
    type: object
    required:
      - key
    properties:
      key:
        type: string
        description: Parameter name
      value:
        type: string
        description: Example value from Postman
      description:
        type: string
        description: Parameter description from Postman
      type:
        type: string
        description: Final computed type (override_type > origin_type > inferred_type)
      inferred_type:
        type: string
        description: Type inferred from examples and patterns
      origin_type:
        type: string
        description: Explicit type from Postman collection (if available)
      override_type:
        type: string
        description: Manual configuration override (empty initially, preserved on updates)

  PaginationMapping:
    type: object
    properties:
      strategy:
        type: string
        enum: [offset, cursor, page]
      next_field:
        type: string
      limit_field:
        type: string

  ResponseMapping:
    type: object
    description: Mapping for response data based on tabular 'return data'/'response data' from Postman descriptions
    properties:
      fields:
        type: object
        description: Map of response field names to their specifications
        additionalProperties:
          $ref: '#/definitions/ResponseField'
      defaults:
        type: object
        description: Default values for missing fields
      container_type:
        type: string
        enum: [dict, list, dataframe]
        description: The container type for the response

  ResponseField:
    type: object
    required:
      - description
    properties:
      description:
        type: string
        description: Field description from Postman
      type:
        type: string
        description: Final computed type (override_type > origin_type > inferred_type)
      inferred_type:
        type: string
        description: Type inferred from examples and patterns
      origin_type:
        type: string
        description: Explicit type from Postman collection (if available)
      override_type:
        type: string
        description: Manual configuration override (empty initially, preserved on updates)
