[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "LimbleConnector"
version = "0.1.0"
description = ""
#authors = [
#    { name = "Your Name", email = "you@example.com" }
#]
#readme = "README.md"
requires-python = ">=3.11"
#license = { text = "MIT" }
dependencies = [
    "anyio>=4.9.0",
    "beautifulsoup4>=4.13.4",
    "cachetools>=5.5.2",
    "certifi>=2025.1.31",
    "charset-normalizer>=3.4.1",
    "et_xmlfile>=2.0.0",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.27.2",
    "idna>=3.10",
    "numpy>=2.2.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "postmanparser>=0.1.9",
    "PuLP>=3.1.1",
    "python-certifi-win32>=1.6.1; sys_platform == 'win32'",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.3",
    "six>=1.17.0",
    "sniffio>=1.3.1",
    "soupsieve>=2.7",
    "typing_extensions>=4.13.2",
    "tzdata>=2025.1",
    "tzlocal>=5.3.1",
    "urllib3>=2.3.0",
]

[tool.setuptools]
packages = ["LimbleConnection"]
package-dir = {"limbleconnector" = "LimbleConnection"}

[tool.setuptools.package-data]
LimbleConnection = ["registry.yaml"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.0.260204",
    "pytest>=9.0.3",
]
