  routes.assets.batch:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.assets.batch.batch_update_asset_fields:
    url: '{api_base_url}/assets/fields/batch/update'
    method: POST
    description_data:
