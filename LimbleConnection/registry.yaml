    is_folder: false
    query_params: []
  routes.assets.logs.delete_asset_log:
    url: '{api_base_url}/assets/logs/:logID'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This requests deletes a manual log entry for an asset.
      non_table_after: ''
    is_folder: false
