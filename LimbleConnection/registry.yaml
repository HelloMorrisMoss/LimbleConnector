  routes.tasks.new_task:
    url: '{api_base_url}/tasks'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - name
        - String
        - Required
        - The name of the Task.
      - - locationID
        - Int
        - Required
        - The id of the Location this Task is assigned to. Must be the Location's
          unique ID number.
      - - due
        - Int
        - Required
        - The time at which the Task is due. Must be a unix timestamp.
      - - type
        - Int
        - Required
        - The type of Task according to this legend:1 = Preventative Maintanance (PM).2
          = Unplanned Work Order (WO);4 = Planned Work Order (WO);6 = Work Request
          (WR).Task types not listed here are not currently supported.If you would
          like another Task type to be supported, please contact us.A taskType of
          6 prevents the user from assigning a batchID.
      - - description
        - string
        - Optional
        - A brief description about the Task.
      - - assetID
        - Int
        - Optional
        - The Asset that the Task will be attached to, if any.Must be the unique ID
          number of the Asset.Omitting this parameter or setting it to zero will not
          attach the Task to an asset.
      - - assignment
        - Int
        - Optional. Required if 'assignmentType' is used.
        - The User or Team to which the Task will be assigned. Must be a User or Team
          that exists at the specified Location. Must be the unique ID number of the
          user or Team. If this parameter is set, the assignmentType parameter must
          also be set.
      - - templateID
        - Int
        - Optional
        - The taskID of the task you wish to utilize as a template when posting a
          new Task. Using this will duplicate all steps in the Template to the newly
          created task. Templates can be easily viewed and built in Limble's web application.
      - - assignmentType
        - Enum
        - Optional. Required if 'assignment' is used.
        - Specifies whether this Task will be assigned to a 'user', 'team' or 'multi'.
          Those two strings are the only accepted input. If this parameter is set,
          the assignment parameter must also be set.
      - - priority
        - Int
        - Optional
        - Specifies the priority of the Task. Must correspond to a 'priorityLevel'
          (See GET Priorities) configured in your in your Limble account.
      - - estimatedTime
        - Int
        - Optional
        - Updates the estimated time of the task. This is the time it takes to complete
          the task in minutes.
      - - requestName
        - string
        - Optional
        - Specifies the name of the Work Requestor.
      - - requestEmail
        - string
        - Optional
        - Specifies the email address of the Work Requestor.
      - - requestPhone
        - string
        - Optional
        - Specifies the phone number of the Work Requestor.
      - - requestDescription
        - string
        - Optional
        - Specifies the description of the problem submitted by the Work Requestor.
      - - meta1
        - string
        - Optional
        - Task meta data. This does not show in the web application, but can be used
          to track items between integrated systems.
      - - meta2
        - string
        - Optional
        - Task meta data. This does not show in the web application, but can be used
          to track items between integrated systems.
      - - meta3
        - string
        - Optional
        - Task meta data. This does not show in the web application, but can be used
          to track items between integrated systems.
      - - geoLocation
        - geoJSON
        - Optional
        - The geoJSON Feature object that can be used to locate a task on a Map.
      - - multiUsers
        - array
        - Optional. Required if assignmentType = multi
        - Array list of users a task is being assigned to.
      non_table_before: This request will create an empty Task, assign to a User or
        Team, etc.
