      data_rows:
      - - fileID
        - The ID of the file attached to the log.
      non_table_before: 'This request adds files to a log.


        Return data description'
      non_table_after: ''
    is_folder: false
    query_params: []
    response:
      fields:
        fileID:
          description: The ID of the file attached to the log.
          inferred_type: int
          type: int
      container_type: list
  routes.assets.logs.asset_logs:
    url: '{api_base_url}/assets/:assetID/logs'
    method: GET
    description_data:
      headers:
      - Property
      - Description
      data_rows:
      - - logID
        - The unique logID of the log.
      - - dateCreated
        - The date the log was created as a UNIX timestamp.
      - - assetD
        - The ID of the asset the log belongs to.
      - - logEntry
        - The log entry for the asset.
      - - userID
        - The ID of the user that created the log.
      - - logFiles
        - An array of objects that have a fileID, fileName and a link that can used
          to download the files attached to the log. All links are only valid for
          15 minutes, a new call will generate a new link.
      non_table_before: 'This request returns logs created manually by users and automatically
        created (where userID=0) by certain actions taken on the asset. Logs related
        to tasks completed on an Asset will not be returned.


        **Note:** this endpoint supports pagination. Please refer to the [**Pagination**](#pagination)
        section for more information.


        Return data description'
      non_table_after: ''
    is_folder: false
    query_params:
    - key: logs
      value: '16'
      description: This parameter is used to only get specific logs. This parameter
        accepts a comma delimited list of logIDs.
      inferred_type: int
      type: int
    - key: users
      value: '341'
      description: This parameter is used to only get logs created by specific users.
        This parameter accepts a comma delimited list of userIDs.
      inferred_type: int
      type: int
    - key: logEntry
      value: '%bro%'
      description: This is a parameter used to string search for manual log entry.
        This parameter expects a string with the wildcard %.
      inferred_type: str
      type: str
    - key: start
      value: '1506274400'
      description: 'This parameter is used to only get logs that were last edited
        after the unix timestamp passed into the start parameter. '
      inferred_type: int
      type: int
    - key: end
      value: '1506274900'
      description: This parameter is used to only get logs that were last edited before
        the unix timestamp passed into the end parameter.
      inferred_type: int
      type: int
    - key: page
      value: '1'
      description: This parameter is used to paginate results based on the limit.
        Refer to Pagination section for more information.
      inferred_type: int
      type: int
    - key: limit
      value: ''
      description: This parameter is a result limiter. The default is set to return
        no more than 100 results at one time.
      inferred_type: int
      type: int
    - key: cursor
      value: ''
      description: 'This parameter is a cursor that selects what ID you want to start
        receiving results at. '
      inferred_type: str
      type: str
    response:
      fields:
        logID:
          description: The unique logID of the log.
          inferred_type: int
          type: int
        dateCreated:
          description: The date the log was created as a UNIX timestamp.
          inferred_type: int
          type: int
        assetD:
          description: The ID of the asset the log belongs to.
          inferred_type: str
          type: str
        logEntry:
          description: The log entry for the asset.
          inferred_type: str
          type: str
        userID:
          description: The ID of the user that created the log.
          inferred_type: int
          type: int
        logFiles:
          description: An array of objects that have a fileID, fileName and a link
            that can used to download the files attached to the log. All links are
            only valid for 15 minutes, a new call will generate a new link.
          inferred_type: list[str]
          type: list[str]
      container_type: list
  routes.assets.logs.new_asset_log:
    url: '{api_base_url}/assets/:assetID/logs'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - userID
        - Int
        - Optional
        - The ID of the user creating the log. If userID is not given a log entry
          with userID=0 will be created.
      - - logEntry
        - String
        - Required
        - Details of the log.
      non_table_before: This requests creates a manual log entry for an asset.
      non_table_after: ''
    is_folder: false
