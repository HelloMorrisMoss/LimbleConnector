version: '1.0'
endpoints:
  routes:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: Limble's API is broken apart by different categories that
        contain multiple routes.  This approach allows you to easily see eveyrthing
        that can be added, edited or removed for different Limble modules.
      non_table_after: ''
  routes.me:
    url: '{api_base_url}/me'
    method: GET
    description_data:
      headers:
      - Property
      - Description
      data_rows:
      - - customerName
        - The name of the customer that your API keys are valid for.
      - - customerPlan
        - The Limble plan the customer is currently subscribed to. The customerPlan
          can have one of following values:starterprofessionalbusinessenterpriselegacy
          - The plan the customer is currently subscribed to has been deprecated.For
          more information about various plans please visit the Limble website.
      non_table_before: 'Identifies the current customer. This route can be used to
        test that authentication to the Limble API was successful.


        Return data description'
      non_table_after: ''
    is_folder: false
    query_params: []
    response:
      fields:
        customerName:
          description: The name of the customer that your API keys are valid for.
          inferred_type: str
          type: str
        customerPlan:
          description: The Limble plan the customer is currently subscribed to. The
            customerPlan can have one of following values:starterprofessionalbusinessenterpriselegacy
            - The plan the customer is currently subscribed to has been deprecated.For
            more information about various plans please visit the Limble website.
          inferred_type: str
          type: str
      container_type: list
  routes.assets:
    url: '{api_base_url}/assets/'
    method: GET
    description_data:
      headers:
      - Property
      - Description
      data_rows:
      - - meta
        - Requests to gather more information on an Asset such as Fields for the Asset
          or what Tasks are assigned to the Asset
      - - startedOn
        - The date when this Asset was started on. This property is used to help determine
          runtime which is used in MTBF.
      - - lastEdited
        - A UNIX timestamp of when this Asset was last edited.
      - - parentAssetID
        - The Asset that is the parent of this Asset. If the value is 0 that means
          this Asset does not have a parent.
      - - locationID
        - The ID of the location this asset is located at.
      - - hoursPerWeek
        - The number of hours this Asset runs per week. This is used to determine
          runtime which is used in MTBF. If the value is -1 then the Asset uses the
          Location's hoursPerWeek setting.
      - - workRequestPortal
        - The url work requestors can use to submit problems with this Asset.
      - - image
        - Array of objects that have a file name and a link you can use to download
          that image. All links are only valid for 15 minutes, a new call will generate
          a new link.
      - - geoLocation
        - The location of an asset on a Map.
      non_table_before: 'This request returns a list of Assets with top level information
        such as name, last edited, etc.


        **Note:** this endpoint supports pagination. Please refer to the [Pagination](#pagination)
        section for more information.


        Return data description'
      non_table_after: ''
    is_folder: false
    query_params:
    - key: assets
      value: '1'
      description: This parameter is used to only get specific Assets. This parameter
        expects a comma delimited list of Asset IDs.
      inferred_type: int
      type: int
    - key: name
      value: '%test%'
      description: This is a parameter used to string search for a name or partial
        name of an asset this parameter expects a string with the wildcard %.
      inferred_type: str
      type: str
    - key: locations
      value: '73'
      description: This parameter is used to only get Assets at a specific group of
        Locations. This parameter accepts a comma delimited list of Location IDs.
      inferred_type: int
      type: int
    - key: start
      value: '1541796014'
      description: This parameter is used to only get Assets that were last edited
        after the unix timestamp passed into the start parameter. For example, all
        Assets that were last edited after April 18th, 2018.
      inferred_type: int
      type: int
    - key: end
      value: '1541796014'
      description: This parameter is used to only get Assets that were last edited
        *before* the unix timestamp passed into the end parameter.
      inferred_type: int
      type: int
    - key: cursor
      value: '0'
      description: This parameter is a cursor that selects what ID you want to start
        receiving results at. Without ordering, this will return results with an ID
        greater than the value of cursor. With ordering, this will return results
        starting at the next item in the order, regardless of whether its ID is greater
        than or lesser than the value of cursor.
      inferred_type: int
      type: int
    - key: limit
      value: '1'
      description: This parameter is a result limiter. The default is set to return
        no more than 100 results at one time.
      inferred_type: int
      type: int
    - key: parentAssetID
      value: '2317'
      description: This parameter can be used to get asset(s) children using the Parent's
        ID. This parameter accepts a comma delimited list of Asset IDs.
      inferred_type: int
      type: int
    - key: orderBy
      value: -lastEdited
      description: This parameter is used to order results by their lastEdited property
        instead of the default ordering by ascending assetID. CANNOT be provided alongside
        the cursor parameter. to paginate in this ordering, use the start or end parameters.
      inferred_type: str
      type: str
    - key: page
      value: '1'
      description: This parameter is used to paginate results based on the limit.
        Refer to Pagination section for more information.
      inferred_type: int
      type: int
    - key: geoLocation
      value: 'true'
      description: This parameter is used to filter results that contain a geoLocation
        property. By default it is false and will return **all** assets with and without
        geoLocation property. If true, it will only return assets with a geoLocation
        property.
      inferred_type: bool
      type: bool
    response:
      fields:
        meta:
          description: Requests to gather more information on an Asset such as Fields
            for the Asset or what Tasks are assigned to the Asset
          inferred_type: str
          type: str
        startedOn:
          description: The date when this Asset was started on. This property is used
            to help determine runtime which is used in MTBF.
          inferred_type: str
          type: str
        lastEdited:
          description: A UNIX timestamp of when this Asset was last edited.
          inferred_type: str
          type: str
        parentAssetID:
          description: The Asset that is the parent of this Asset. If the value is
            0 that means this Asset does not have a parent.
          inferred_type: int
          type: int
        locationID:
          description: The ID of the location this asset is located at.
          inferred_type: int
          type: int
        hoursPerWeek:
          description: The number of hours this Asset runs per week. This is used
            to determine runtime which is used in MTBF. If the value is -1 then the
            Asset uses the Location's hoursPerWeek setting.
          inferred_type: str
          type: str
        workRequestPortal:
          description: The url work requestors can use to submit problems with this
            Asset.
          inferred_type: str
          type: str
        image:
          description: Array of objects that have a file name and a link you can use
            to download that image. All links are only valid for 15 minutes, a new
            call will generate a new link.
          inferred_type: str
          type: str
        geoLocation:
          description: The location of an asset on a Map.
          inferred_type: str
          type: str
      container_type: list
  routes.assets.image:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.assets.image.add_asset_main_image:
    url: '{api_base_url}/assets/:assetID/image'
    method: PUT
    description_data:
      headers: []
      data_rows: []
      non_table_before: Each asset can have one main image associated with it.  This
        request allows you to set that image.
      non_table_after: ''
    is_folder: false
    query_params: []
  routes.assets.image.delete_asset_main_image:
    url: '{api_base_url}/assets/:assetID/image'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This request removes the main image from the asset.
      non_table_after: ''
    is_folder: false
    query_params: []
  routes.assets.fields:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: Asset fields are a way to add custom information onto your
        assets.  For example you may want to fields such as Make, Model, Meter Readings,
        Manuals, Pictures, Contracts etc.
      non_table_after: ''
  routes.assets.fields.asset_fields:
    url: '{api_base_url}/assets/fields/'
    method: GET
    description_data:
      headers: []
      data_rows: []
      non_table_before: 'This request gets detailed information about asset fields
        such as Make, Model and any other custom field.


        This call also returns "files" which is an array of objects that have a file
        name and a link you can use to download that file. All links are only valid
        for 15 minutes, a new call will generate a new link.


        **Note:** this endpoint supports pagination. Please refer to the [**Pagination**](#pagination)
        section for more information.'
      non_table_after: ''
    is_folder: false
    query_params:
    - key: name
      value: Model
      description: This parameter is used to only get specific field by name. This
        parameter expects a string full name of a field or partial name with the wildcard
        %.
      inferred_type: str
      type: str
    - key: fields
      value: '107'
      description: This parameter can be used to get a single Asset Fields or a list
        of Asset Fields in a comma-separated list.
      inferred_type: int
      type: int
    - key: start
      value: '1555105636'
      description: This parameter is used to only get Asset Fields for Assets that
        were last edited after the unix timestamp passed into the start parameter.
        For example, all Assets that were last edited after April 18th, 2018.
      inferred_type: int
      type: int
    - key: end
      value: '1555105636'
      description: This parameter is used to only get Asset Fields for Assets that
        were last edited *before* the unix timestamp passed into the end parameter.
      inferred_type: int
      type: int
    - key: cursor
      value: '0'
      description: This parameter is a cursor that selects what id you want to start
        receiving results at. e.g. passing 137 here will only get you asset fields
        with an id greater than 137.
      inferred_type: int
      type: int
    - key: limit
      value: '1'
      description: This parameter is a result limiter. The default is set to return
        no more than 100 results at one time.
      inferred_type: int
      type: int
    - key: locations
      value: '163'
      description: This parameter can be used to get a group of asset fields in a
        location in a comma-separated list.
      inferred_type: int
      type: int
    - key: value
      value: F250
      description: This parameter is used to only get specific field by value. This
        parameter expects a string full name of a field or partial name with the wildcard
        %.
      inferred_type: str
      type: str
    - key: assetName
      value: '%fork%'
      description: This parameter is used to only get specific fields by asset name.
        This parameter expects a string full name of a field or partial name with
        the wildcard %.
      inferred_type: str
      type: str
    - key: fieldType[0]
      value: Text
      description: This parameter is used to only get specific fields by type. This
        parameter expects an array of strings "Text, Date, Pictures, Documents, Number,
        Currency, Dropdown"
      inferred_type: str
      type: str
    - key: fieldType[1]
      value: Documents
      description: This parameter is used to only get specific fields by type. This
        parameter expects an array of strings "Text, Date, Pictures, Documents, Number,
        Currency, Dropdown"
      inferred_type: str
      type: str
    - key: page
      value: '1'
      description: This parameter is used to paginate results based on the limit.
        Refer to Pagination section for more information.
      inferred_type: int
      type: int
    - key: values
      value: ''
      description: This parameter is used to get asset fields by their valueID. This
        parameter expects a comma delimited list of Value IDs.
      inferred_type: list[str]
      type: list[str]
    - key: assets
      value: '171'
      description: This parameter can be used to get a group of asset fields for a
        specific set of asset ids in a comma-separated list.
      inferred_type: int
      type: int
  routes.assets.fields.asset_suggested_fields:
    url: '{api_base_url}/assets/fields/suggested'
    method: GET
    description_data:
      headers: []
      data_rows: []
      non_table_before: "This request gets all possible fields an Asset can pick from\
        \ when deciding which fields it should have.  \n\nTo understand this concept,\
        \ let's pretend you have the following assets:  \n\nYour first Asset (a Truck)\
        \ has the fields Make, Model, and VIN.  \n\nYour second Asset (a HVAC) has\
        \ the fields Make, Model, and Serial Number.  \n\nThis would mean there are\
        \ 4 suggested fields that exist:  Make, Model, VIN and Serial Number.  If\
        \ I added a third new asset I could pick from any of the 4 suggested fields.\n\
        \nSuggested fields are the full list of possible fields that can be added\
        \ to assets at that location."
      non_table_after: ''
    is_folder: false
    query_params:
    - key: fields
      value: '16'
      description: This parameter can be used to get a single Asset Fields or a list
        of Asset Fields in a comma-separated list.
      inferred_type: int
      type: int
    - key: name
      value: '%S%'
      description: This parameter is used to only get specific field by name. This
        parameter expects a string full name of a field or partial name with the wildcard
        %.
      inferred_type: str
      type: str
    - key: cursor
      value: '0'
      description: This parameter is a cursor that selects what id you want to start
        receiving results at. e.g. passing 137 here will only get you asset fields
        with an id greater than 137.
      inferred_type: int
      type: int
    - key: limit
      value: '100'
      description: This parameter is a result limiter. The default is set to return
        no more than 100 results at one time.
      inferred_type: int
      type: int
    - key: locations
      value: '163'
      description: This parameter is used to only get fields at a specific group of
        Locations. This parameter accepts a comma delimited list of Location IDs.
      inferred_type: int
      type: int
  routes.assets.fields.asset_field_history:
    url: '{api_base_url}/assets/fields/history'
    method: GET
    description_data:
      headers: []
      data_rows: []
      non_table_before: "Any time an Asset's field is changed an entry is inserted\
        \ into a history.  \n\nThis request allows you to pull that information so\
        \ you can see trends over time."
      non_table_after: ''
    is_folder: false
    query_params:
    - key: assets
      value: 4864, 4865
      description: This parameter can be used to get a single Asset or a list of Assets
        in a comma-separated list.
      inferred_type: list[str]
      type: list[str]
    - key: fields
      value: 321, 202
      description: This parameter can be used to get a single Asset Fields or a list
        of Asset Fields in a comma-separated list.
      inferred_type: list[str]
      type: list[str]
    - key: start
      value: '1555105636'
      description: This parameter is used to only get Asset Fields for Assets that
        were last edited after the unix timestamp passed into the start parameter.
        For example, all Assets that were last edited after April 18th, 2018.
      inferred_type: int
      type: int
    - key: end
      value: '1555105636'
      description: This parameter is used to only get Asset Fields for Assets that
        were last edited *before* the unix timestamp passed into the end parameter.
      inferred_type: int
      type: int
    - key: limit
      value: '100'
      description: This parameter is a cursor that selects what id you want to start
        receiving results at. e.g. passing 137 here will only get you asset fields
        with an id greater than 137.
      inferred_type: int
      type: int
    - key: cursor
      value: '0'
      description: This parameter is a result limiter. The default is set to return
        no more than 100 results at one time.
      inferred_type: int
      type: int
  routes.assets.fields.new_asset_suggested_field:
    url: '{api_base_url}/assets/fields/'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - locationID
        - Int
        - Required
        - The location ID of the Asset to add the new Field to.
      - - name
        - String
        - Required
        - The name of the new Field. Some custom field names such as "Asset" are not
          allowed and reserved for internal use. This will result in a 409 error.
      - - fieldType
        - Int
        - Required
        - "The type of the new Field. You can choose from Text (1), Date (2), Pictures\
          \ (3), Documents (4), Number (5),\n\t\t\t\tCurrency (6)."
      non_table_before: 'This request creates a new Suggested Field.


        Suggested Fields are the full list of possible Fields that can be added to
        Assets at that Location.'
      non_table_after: ''
    is_folder: false
    query_params: []
  routes.assets.fields.update_asset_field_value:
    url: '{api_base_url}/assets/fields/:valueID/'
    method: PATCH
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - value
        - Varies depending on the Field's type
        - Required
        - The value that will be written to the field, overwriting the previous value
          and creating an entry in the field history.  "value" must correspond to
          the fieldType of the field. For example, if the field is a "number" fieldType,
          then "value" must be a number.
      non_table_before: This request updates the value of a Field that is attached
        to an Asset.
      non_table_after: ''
    is_folder: false
    query_params:
    - key: ''
      value: ''
      description: ''
      inferred_type: str
      type: str
  routes.assets.fields.attach_field_to_asset:
    url: '{api_base_url}/assets/:assetID/fields'
    method: PUT
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - locationID
        - Int
        - Required
        - The ID of the Location the Asset exists at.
      - - fieldID
        - Int
        - Required
        - The ID of the existing Field to add to the Asset.
      non_table_before: 'This request attaches a Suggested Field to an Asset. The
        field and asset must belong to the same location.


        For example, let''s say I have an Asset called Truck - 001.  This Truck doesn''t
        have any Fields attached to it, but I want to track its Make so I can set
        that this Truck is a Dodge.  This is the request I would use to attach the
        Make Field to the Truck and then I would use the Update Asset Field Value
        request to set it to Dodge.'
      non_table_after: ''
    is_folder: false
    query_params: []
  routes.assets.fields.delete_asset_field:
