    url: '{api_base_url}/tasks/:taskID/tags'
    method: PUT
    description_data:
      headers: []
      data_rows: []
      non_table_before: "Applies one or more existing custom tags to a task. Tags\
        \ must already exist at the account level (see POST /v2/tags to create new\
        \ tags).\n\nBody:\n- tags: string[] \u2014 List of tags, or\n- tag: string\
        \ \u2014 Single tag.\n\nSuccess Response (200):\n- created: true\n- name?:\
        \ string \u2014 Present when a single tag was added; canonical without trailing\
        \ ';'.\n- sanitizations?: string[] \u2014 Applied normalizations.\n- note?:\
        \ string \u2014 Present when input had multiple '@' characters.\n- tags: string[]\
        \ \u2014 Updated canonical tags with trailing ';'.\n\nConflicts (409):\n-\
        \ Single: { created: false, message: 'Tag already exists', name, tags }\n\
        - Multiple: { created: false, message: 'No new tags to add', tags }\n\nErrors:\n\
        - 404: { created: false, message, invalidTag(s), tags, availableTags } \u2014\
        \ Tag(s) don't exist at account level.\n- 400: { added: [], message: string\
        \ } \u2014 Invalid input (semicolons, empty tags, etc.).\n\nNotes:\n- Tags\
        \ MUST exist in the account's tag definitions before they can be applied to\
        \ tasks.\n- Validation is case-insensitive (e.g., '@urgent' matches '@Urgent').\n\
        - Semicolons in input are rejected.\n- The availableTags field in 404 responses\
        \ shows which tags can be used."
      non_table_after: ''
    is_folder: false
