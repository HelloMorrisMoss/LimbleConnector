  routes.purchase_orders.items.new_purchase_order_item:
    url: '{api_base_url}/po/:poID/items'
    method: POST
    description: 'This request creates a new Purchase Order Item.


      <p><br><br></p><p><br><br><br></p><table><tbody><tr><th>Parameter</th><th>Type</th><th>Required?</th><th>Description</th></tr><tr><td>itemType</td><td>Int</td><td>Required</td><td>A
