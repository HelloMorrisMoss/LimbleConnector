      \ |\n| reviewedByUserId | The unique identifier of the user who reviewed the\
      \ submission. |\n| reviewedAt | The date the work request submission was reviewed.\
      \ The timestamp is in the following format: YYYY-MM-DD (2025-07-02) HH:MM:SS\
      \ (21:36:31) Will be NULL if the submission has not yet been reviewed |\n| reviewedReason\
      \ | The predefined reason the work request was declined. |\n| additionalNotes\
      \ | Any additional notes the person who declined the submission wishes to leave.\
      \ |\n| locationId | The unique identifier of the location the submission belongs\
      \ to. |\n| assetId | The unique identifier of the asset associated with the\
      \ submission. |\n| priorityId | The unique identifier of the priority of the\
      \ submission. |\n| dueDateUnit | The unit of measure used to communicate when\
      \ the task will be due. Can be \u201Cdays\u201D or \u201Chours\u201D. |\n| requestInformation\
      \ | The information filled out in the Work Request Portal. Includes any of the\
      \ following fields in JSON format. customerCode requesterName requesterEmail\
      \ requesterPhone timeUnix customTag customFieldOne customFieldTwo customFieldThree\
      \ customFieldOneTitle customFieldTwoTitle customFieldThreeTitle customFieldDropdownAnswerOne\
      \ customFieldDropdownAnswerTwo customFieldDropdownAnswerThree customDropdownTitleOne\
      \ customDropdownTitleTwo customDropdownTitleThree customDropdownOptionsOne customDropdownOptionsTwo\
      \ customDropdownOptionsThree geoLocation |\n| customerID | The unique identifier\
      \ of the customer account. |\n| requestTitle | The title of the submission.\
      \ |\n| assignedToProfileId | The Limble profile the submission is assigned to.\
      \ This is used to determine what team or individual is assigned to review the\
