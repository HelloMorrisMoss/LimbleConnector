  routes.purchase_orders.items.receive_po_item:
    url: '{api_base_url}/po/:poID/items/:poItemID'
    method: PUT
    description: "This request marks a quantity of a PO item as having been received\
      \ and generates a bill for the receipt of the item.\n\n<table class=\"apiTable\"\
      >\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Parameter</th>\n\t\t\t<th>Type</th>\n\t\t\t\
      <th>Required?</th>\n\t\t\t<th>Description</th>\n\t\t</tr>\n\t</thead>\n\t<tbody>\n\
      \t\t<tr>\n\t\t\t<td>quantity</td>\n\t\t\t<td>Int</td>\n\t\t\t<td>Required</td>\n\
      \t\t\t<td>A positive number representing the received number of items. The sum\
      \ of all receipts cannot be greater than the total quantity on the PO item.<br/><br/>For\
      \ example: if a PO item has a quantity of 5, then we use this request to receive\
      \ 3, that will mark 3 of the PO item as received and generate a bill for that\
      \ receipt of 3 PO items. If we run the same request again to receive another\
      \ 3, the total would be 6 and the request would be rejected with an error.</td>\n\
      \t\t</tr>\n\t</tbody>\n</table>\n\n<strong>Return data description</strong>\n\
      \n<table>\n    <thead>\n        <tr>\n            <th>Property</th>\n      \
      \      <th>Description</th>\n        </tr>\n    </thead>\n    <tbody>\n    \
      \    <tr>\n            <td>transactionID</td>\n            <td>The unique ID\
      \ of the transaction created by this request.</td>\n        </tr>\n        <tr>\n\
      \            <td>prID</td>\n            <td>The unique ID of the PR (Bill) created\
      \ by this request.</td>\n        </tr>\n    </tbody>\n</table>"
