    method: POST
    description_data:
      headers: []
      data_rows: []
      non_table_before: 'Creates a new account-level custom tag. The tag is normalized
        and validated before creation.


        **Request Body:**

        - `name` (string, required) - Tag name with or without leading ''@'', must
        not contain '';''


        **Response (200 OK):**

        - `created` (boolean) - Always true on success

        - `name` (string) - Canonical tag name without trailing '';'' (e.g., `@Food
        Safety`)

        - `sanitizations` (array, optional) - List of normalization actions applied

        - `tags` (array) - All account tags in canonical format with trailing '';''


        **Normalization Rules:**

        - Semicolons '';'' are rejected (not allowed in input)

        - Internal ''@'' characters removed, single leading ''@'' added

        - Backslashes removed

        - Commas converted to spaces

        - Whitespace collapsed

        - CR/LF and NBSP normalized to spaces

        - ASCII control characters removed


        **Error Responses:**

        - 400 Bad Request - Invalid input (contains '';'' or normalizes to empty)

        - 409 Conflict - Tag already exists (case-insensitive comparison)'
      non_table_after: ''
    is_folder: false
  routes.tags.rename_account_tag:
    url: '{api_base_url}/tags'
    method: PATCH
    description_data:
      headers: []
      data_rows: []
      non_table_before: "Renames an account-level custom tag.  \n  \n**IMPORTANT NOTE:**\
        \ The change propagates to all data entities using this tag (Tasks, dashboards,\
        \ notifications, etc).\n\n**Request Body:**\n\n- `oldName` (string, required)\
        \ - Existing tag name (with or without '@', without trailing ';')\n    \n\
        - `newName` (string, required) - New tag name (with or without '@', without\
        \ trailing ';')\n    \n\n**Response (200 OK):**\n\n- `renamed` (boolean) -\
        \ Always true on success\n    \n- `from` (string) - Old canonical tag name\
        \ without trailing ';'\n    \n- `to` (string) - New canonical tag name without\
        \ trailing ';'\n    \n- `tags` (array) - All account tags in canonical format\
        \ with trailing ';'\n    \n\n**Validation:**\n\n- Old tag must exist (case-insensitive)\n\
        \    \n- New tag must not exist (case-insensitive)\n    \n- Semicolons not\
        \ allowed in input\n    \n- Both names subject to normalization rules\n  \
        \  \n\n**Error Responses:**\n\n- 400 Bad Request - Invalid input (contains\
        \ ';' or normalizes to empty)\n    \n- 404 Not Found - Old tag does not exist\n\
        \    \n- 409 Conflict - New tag name already exists"
      non_table_after: ''
    is_folder: false
  routes.tags.delete_account_tag:
    url: '{api_base_url}/tags/:tagName'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: "Deletes an account-level custom tag.\n\n**IMPORTANT NOTE:**\
        \ The change propagates to all data entities using this tag (Tasks, dashboards,\
        \ notifications, etc).\n\n**Path Parameters:**\n\n- `tagName` (string, required)\
        \ - Tag name to delete (with or without '@', without trailing ';')\n    -\
        \ URL encode special characters (e.g., `@Food Safety` for `@Food Safety`)\n\
        \        \n\n**Response (200 OK):**\n\n- `deleted` (boolean) - Always true\
        \ on success\n    \n- `name` (string) - Canonical tag name that was deleted\
        \ (without trailing ';')\n    \n- `tags` (array) - Remaining account tags\
        \ in canonical format with trailing ';'\n    \n\n**Validation:**\n\n- Tag\
        \ must exist (case-insensitive)\n    \n- Tag name subject to normalization\
        \ for matching\n    \n\n**Error Responses:**\n\n- 404 Not Found - Tag does\
