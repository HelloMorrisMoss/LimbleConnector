  routes.purchase_orders.state.change_po_state:
    url: '{api_base_url}/po/:poID/state'
    method: PATCH
    description: "Updates the state of the specified PO.  \n  \nImportant Note: Currently\
      \ POs can only move forward one state per state change request.\n\nParameters:\n\
      \n| Parameter | In | Type | Required | Default | Description |\n| --- | ---\
      \ | --- | --- | --- | --- |\n| poID | path | integer | yes |  | Purchase Order\
      \ identifier |\n| newState | body | string | yes |  | All PO states: 0 (setup),\
      \ 1\u201396 (custom), 97 (ready_to_receive), 98 (partially_received), 99 (fully_received),\
      \ 100 (closed), 101 (disapproved). API accepts numbers, standard names, or custom_step_N\
      \ |\n| reason | body | string | no |  | Optional note (max 500 chars) |\n\n\
      Responses:\n\n- 200 OK: State changed.\n    \n- 400 Bad Request: Invalid transition\
      \ or failed validation.\n    \n- 404 Not Found: PO not found.\n    \n\nResponse\
      \ data:\n\n<table><tbody><tr><th>Property</th><th>Description</th></tr><tr><td><div>success</div><div\
      \ contenteditable=\"false\"><div><div><div></div></div></div><div></div></div></td><td><div>Boolean,\
