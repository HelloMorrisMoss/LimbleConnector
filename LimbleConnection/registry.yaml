          number of the asset.Omitting this parameter or setting it to zero will not
          attach the task to any asset.
      - - assignment
        - Int
        - Optional. Required if 'assignmentType' is used.
        - The user or team to which the task will be assigned.Must be a user or team
          that exists at the specified location. Must be the unique ID number of the
          user orteam.If this parameter is set, the assignmentType parameter must
          also be set.
      - - assignmentType
        - Enum
        - Optional. Required if 'assignment' is used.
        - Specifies wether this task will be assigned to a 'user' , 'team' or `multi`.
          Those two strings are the only acceptedinput.If this parameter is set, the
          assignment parameter must also be set.
      - - priority
        - Int
        - Optional
        - 'Specifies the priority of the task. Must be between 0 and 6 inclusive:
          0 = lowest priority, 5 = highestpriority, 6 = "On Hold".'
      - - estimatedTime
        - Int
        - Optional
        - Updates the estimated time of the task. This is the time it takes to complete
          the task in minutes.
      - - requestName
        - string
        - Optional
        - Specifies the name of the work requestor.
      - - requestEmail
        - string
        - Optional
        - Specifies the email address of the work requestor.
      - - requestPhone
        - string
        - Optional
        - Specifies the phone number of the work requestor.
      - - requestDescription
        - string
        - Optional
        - Specifies the description set by the work requestor.
      - - status
        - int
        - Optional
        - 1 - Closes a task.0 - Opens a task.If this parameter is set to 1, the assignment
          and assignmentType parameters must also be set.
      - - meta1
        - string
        - Optional
        - Task meta data. This does not show in the web application, but can be used
          to track items between integrated systems.
      - - meta2
        - string
        - Optional
        - Task meta data. This does not show in the web application, but can be used
          to track items between integrated systems.
      - - meta3
        - string
        - Optional
        - Task meta data. This does not show in the web application, but can be used
