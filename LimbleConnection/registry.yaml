      ID of the Asset that this PO Item will belong to.</td></tr><tr><td>partID</td><td>Int</td><td>Optional</td><td>The
      ID of the Part that this PO Item will belong to.</td></tr><tr><td>quantity</td><td>Int</td><td>Optional</td><td>A
      number for how many items are represented in this line. If not provided, the
      minimum and default values are 1.</td></tr><tr><td>rate</td><td>Float</td><td>Optional</td><td>A
      decimal (precision 4) representing the cost of one of the item(s). Default is
      0.0000</td></tr><tr><td>tax</td><td>Float</td><td>Optional</td><td>A decimal
      (precision 4) representing the amount of tax on the item(s) as a percent. Default
