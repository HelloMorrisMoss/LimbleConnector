      \ submission was last updated. The timestamp is in the following format: YYYY-MM-DD\
      \ (2025-07-02) HH:MM:SS (21:36:31) |\n| deletedAt | The date the work request\
      \ submission was deleted. The timestamp is in the following format: YYYY-MM-DD\
