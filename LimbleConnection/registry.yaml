  routes.units_of_measure.update_unit:
    url: '{api_base_url}/uom/:unitCode'
    method: PATCH
    description_data:
      headers: []
      data_rows: []
      non_table_before: "The HTTP PATCH request is used to update a specific unit\
        \ identified by its unit code. The request should be made to the endpoint\
        \ `{{protocol}}://{{server}}:{{port}}/v2/uom/:unitCode`, where `:unitCode`\
        \ is the unique identifier of the unit being updated.\n\n### Request Body\n\
        \nThe body is interpreted slightly differently, depending on whether the `unitCode`\
        \ in the url is for a custom unit or a provided unit. If it is custom, then\
        \ either property can be used to update the unit. If it is a provided unit,\
        \ the `name` property will be ignored and only the `abbreviation` property\
        \ will be used to override the defaut one. You can also use `null` to remove\
        \ the override from the provided unit. If either property is `null` for a\
        \ custom unit, that property will not be updated.\n\nThe request should include\
        \ a JSON payload with the following parameters:\n\n- `name` (string): The\
        \ full name of the unit.\n    \n- `abbreviation` (string): A compact name\
        \ of the unit.\n    \n\n### Response\n\nThe full object of the updated unit."
