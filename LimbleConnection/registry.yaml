    method: PATCH
    description_data:
      headers: []
      data_rows: []
      non_table_before: "Updates an existing custom status. Default statuses (0, 1,\
        \ 2) cannot be modified.\n\n**IMPORTANT NOTE:** Changes to statuses automatically\
        \ propogate to all tasks currently assigned that status.\n\n**Path Parameters:**\n\
        \n- `statusID` (number, required) - ID of the status to update\n    \n\n**Request\
        \ Body (at least one field required):**\n\n- `name` (string, optional) - New\
        \ status name, 1-100 characters, must be unique\n    \n- `description` (string,\
        \ optional) - New description, max 65535 characters\n    \n- `sortOrder` (integer,\
        \ optional) - New display order, 0-99\n    \n\n**Validation:**\n\n- Cannot\
        \ modify default statuses (IDs 0, 1, 2)\n    \n- If changing name, must not\
        \ conflict with existing statuses\n    \n- Status must exist and belong to\
        \ the customer"
      non_table_after: ''
