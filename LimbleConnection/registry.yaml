version: '1.0'
endpoints:
  routes:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: Limble's API is broken apart by different categories that
        contain multiple routes.  This approach allows you to easily see eveyrthing
        that can be added, edited or removed for different Limble modules.
      non_table_after: ''
  routes.me:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: This endpoint can be used to test authentication to Limble's
        API.
      non_table_after: ''
  routes.me.me:
    url: '{api_base_url}/me'
    method: GET
    description_data:
      headers:
      - Property
      - Description
      data_rows:
      - - customerName
        - The name of the customer that your API keys are valid for.
      - - customerPlan
        - The Limble plan the customer is currently subscribed to. The customerPlan
          can have one of following values:starterprofessionalbusinessenterpriselegacy
          - The plan the customer is currently subscribed to has been deprecated.For
          more information about various plans please visit the Limble website.
      non_table_before: 'Identifies the current customer. This route can be used to
        test that authentication to the Limble API was successful.


        Return data description'
      non_table_after: ''
    is_folder: false
  routes.assets:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: Assets can be just about anything.  Limble customers often
        use it to represent their equipment, but assets can be used to represent locations,
        areas, buildings and even intangible items.
      non_table_after: ''
  routes.assets.image:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.assets.image.add_asset_main_image:
    url: '{api_base_url}/assets/:assetID/image'
    method: PUT
    description_data:
      headers: []
      data_rows: []
      non_table_before: Each asset can have one main image associated with it.  This
        request allows you to set that image.
      non_table_after: ''
    is_folder: false
  routes.assets.image.delete_asset_main_image:
    url: '{api_base_url}/assets/:assetID/image'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This request removes the main image from the asset.
      non_table_after: ''
    is_folder: false
  routes.assets.fields:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: Asset fields are a way to add custom information onto your
        assets.  For example you may want to fields such as Make, Model, Meter Readings,
        Manuals, Pictures, Contracts etc.
      non_table_after: ''
  routes.assets.fields.asset_fields:
    url: '{api_base_url}/assets/fields/'
    method: GET
    description_data:
      headers: []
      data_rows: []
      non_table_before: 'This request gets detailed information about asset fields
        such as Make, Model and any other custom field.


        This call also returns "files" which is an array of objects that have a file
        name and a link you can use to download that file. All links are only valid
        for 15 minutes, a new call will generate a new link.


        **Note:** this endpoint supports pagination. Please refer to the [**Pagination**](#pagination)
        section for more information.'
      non_table_after: ''
    is_folder: false
  routes.assets.fields.asset_suggested_fields:
    url: '{api_base_url}/assets/fields/suggested'
    method: GET
    description_data:
      headers: []
      data_rows: []
      non_table_before: "This request gets all possible fields an Asset can pick from\
        \ when deciding which fields it should have.  \n\nTo understand this concept,\
        \ let's pretend you have the following assets:  \n\nYour first Asset (a Truck)\
        \ has the fields Make, Model, and VIN.  \n\nYour second Asset (a HVAC) has\
        \ the fields Make, Model, and Serial Number.  \n\nThis would mean there are\
        \ 4 suggested fields that exist:  Make, Model, VIN and Serial Number.  If\
        \ I added a third new asset I could pick from any of the 4 suggested fields.\n\
        \nSuggested fields are the full list of possible fields that can be added\
        \ to assets at that location."
      non_table_after: ''
    is_folder: false
  routes.assets.fields.asset_field_history:
    url: '{api_base_url}/assets/fields/history'
    method: GET
    description_data:
      headers: []
      data_rows: []
      non_table_before: "Any time an Asset's field is changed an entry is inserted\
        \ into a history.  \n\nThis request allows you to pull that information so\
        \ you can see trends over time."
      non_table_after: ''
    is_folder: false
  routes.assets.fields.new_asset_suggested_field:
    url: '{api_base_url}/assets/fields/'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - locationID
        - Int
        - Required
        - The location ID of the Asset to add the new Field to.
      - - name
        - String
        - Required
        - The name of the new Field. Some custom field names such as "Asset" are not
          allowed and reserved for internal use. This will result in a 409 error.
      - - fieldType
        - Int
        - Required
        - "The type of the new Field. You can choose from Text (1), Date (2), Pictures\
          \ (3), Documents (4), Number (5),\n\t\t\t\tCurrency (6)."
      non_table_before: 'This request creates a new Suggested Field.


        Suggested Fields are the full list of possible Fields that can be added to
        Assets at that Location.'
      non_table_after: ''
    is_folder: false
  routes.assets.fields.update_asset_field_value:
    url: '{api_base_url}/assets/fields/:valueID/'
    method: PATCH
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - value
        - Varies depending on the Field's type
        - Required
        - The value that will be written to the field, overwriting the previous value
          and creating an entry in the field history.  "value" must correspond to
          the fieldType of the field. For example, if the field is a "number" fieldType,
          then "value" must be a number.
      non_table_before: This request updates the value of a Field that is attached
        to an Asset.
      non_table_after: ''
    is_folder: false
  routes.assets.fields.attach_field_to_asset:
    url: '{api_base_url}/assets/:assetID/fields'
    method: PUT
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - locationID
        - Int
        - Required
        - The ID of the Location the Asset exists at.
      - - fieldID
        - Int
        - Required
        - The ID of the existing Field to add to the Asset.
      non_table_before: 'This request attaches a Suggested Field to an Asset. The
        field and asset must belong to the same location.


        For example, let''s say I have an Asset called Truck - 001.  This Truck doesn''t
        have any Fields attached to it, but I want to track its Make so I can set
        that this Truck is a Dodge.  This is the request I would use to attach the
        Make Field to the Truck and then I would use the Update Asset Field Value
        request to set it to Dodge.'
      non_table_after: ''
    is_folder: false
  routes.assets.fields.delete_asset_field:
    url: '{api_base_url}/assets/fields/:valueID'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This request deletes a field attached to an Asset.
      non_table_after: ''
    is_folder: false
  routes.assets.logs:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.assets.logs.files:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.assets.logs.files.delete_asset_log_file:
    url: '{api_base_url}/assets/logs/file/:fileID'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This requests deletes a file attached to a log.
      non_table_after: ''
    is_folder: false
  routes.assets.logs.files.add_asset_log_file:
    url: '{api_base_url}/assets/:assetID/logs/:logID/file'
    method: PUT
    description_data:
      headers:
      - Property
      - Description
      data_rows:
      - - fileID
        - The ID of the file attached to the log.
      non_table_before: 'This request adds files to a log.


        Return data description'
      non_table_after: ''
    is_folder: false
  routes.assets.logs.asset_logs:
    url: '{api_base_url}/assets/:assetID/logs'
    method: GET
    description_data:
      headers:
      - Property
      - Description
      data_rows:
      - - logID
        - The unique logID of the log.
      - - dateCreated
        - The date the log was created as a UNIX timestamp.
      - - assetD
        - The ID of the asset the log belongs to.
      - - logEntry
        - The log entry for the asset.
      - - userID
        - The ID of the user that created the log.
      - - logFiles
        - An array of objects that have a fileID, fileName and a link that can used
          to download the files attached to the log. All links are only valid for
          15 minutes, a new call will generate a new link.
      non_table_before: 'This request returns logs created manually by users and automatically
        created (where userID=0) by certain actions taken on the asset. Logs related
        to tasks completed on an Asset will not be returned.


        **Note:** this endpoint supports pagination. Please refer to the [**Pagination**](#pagination)
        section for more information.


        Return data description'
      non_table_after: ''
    is_folder: false
  routes.assets.logs.new_asset_log:
    url: '{api_base_url}/assets/:assetID/logs'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - userID
        - Int
        - Optional
        - The ID of the user creating the log. If userID is not given a log entry
          with userID=0 will be created.
      - - logEntry
        - String
        - Required
        - Details of the log.
      non_table_before: This requests creates a manual log entry for an asset.
      non_table_after: ''
    is_folder: false
  routes.assets.logs.update_asset_log:
    url: '{api_base_url}/assets/logs/:logID'
    method: PATCH
    description_data:
      headers: []
      data_rows: []
      non_table_before: This requests updates a manual log entry for an asset.
      non_table_after: ''
    is_folder: false
  routes.assets.logs.delete_asset_log:
    url: '{api_base_url}/assets/logs/:logID'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This requests deletes a manual log entry for an asset.
      non_table_after: ''
    is_folder: false
  routes.assets.batch:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.assets.batch.batch_update_asset_fields:
    url: '{api_base_url}/assets/fields/batch/update'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - valueID
        - Integer
        - Required
        - The valueID of the asset field value
      - - value
        - Based on the type of value
        - Required
        - The value that needs to be updated
      non_table_before: 'This request will update multiple asset fields values at
        a time. The request expects an array of asset fields values. The array needs
        to have atleast two asset field values and atmost 100 asset field values.
        The request expects an array made up of asset field values that need to be
        updated. Only asset fields values of type Text (1), Date (2), Number (5) and
        Currency (6) can be updated using this request.


        The response returns `{ sucess:true }` if all field values are updated successfully.
        The response returns `{ sucess: false }` and an `updates` array that gives
        details of which field values were updated and the `reason` for field values
        that were not updated successfully. Please refer to the examples for more
        information.'
      non_table_after: ''
    is_folder: false
  routes.assets.parts:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.assets.parts.asset_parts:
    url: '{api_base_url}/assets/parts'
    method: GET
    description_data:
      headers:
      - Property
      - Description
      data_rows:
      - - relationID
        - The Relations ID. e.g. 1
      - - partID
        - The ID of the Part in this Relation
      - - assetID
        - The ID of the Asset in this Relation
      - - qty
        - The qty of the Part related to this Asset
      - - createdAt
        - The unix timestamp at which this Relation was created
      - - lastEdited
        - The unix timestamp at which this Relation last saw a change
      - - associationType
        - The method used to create this Relation. At this time, only "manual" is
          supported
      non_table_before: 'This request returns a list of Part Asset Relations with
        top level information such as part, asset, qty, last edited, etc.


        **Note:** this endpoint supports pagination. Please refer to the [Pagination](#pagination)
        section for more information.


        Return data description'
      non_table_after: ''
    is_folder: false
  routes.assets.assets:
    url: '{api_base_url}/assets/'
    method: GET
    description_data:
      headers:
      - Property
      - Description
      data_rows:
      - - meta
        - Requests to gather more information on an Asset such as Fields for the Asset
          or what Tasks are assigned to the Asset
      - - startedOn
        - The date when this Asset was started on. This property is used to help determine
          runtime which is used in MTBF.
      - - lastEdited
        - A UNIX timestamp of when this Asset was last edited.
      - - parentAssetID
        - The Asset that is the parent of this Asset. If the value is 0 that means
          this Asset does not have a parent.
      - - locationID
        - The ID of the location this asset is located at.
      - - hoursPerWeek
        - The number of hours this Asset runs per week. This is used to determine
          runtime which is used in MTBF. If the value is -1 then the Asset uses the
          Location's hoursPerWeek setting.
      - - workRequestPortal
        - The url work requestors can use to submit problems with this Asset.
      - - image
        - Array of objects that have a file name and a link you can use to download
          that image. All links are only valid for 15 minutes, a new call will generate
          a new link.
      - - geoLocation
        - The location of an asset on a Map.
      non_table_before: 'This request returns a list of Assets with top level information
        such as name, last edited, etc.


        **Note:** this endpoint supports pagination. Please refer to the [Pagination](#pagination)
        section for more information.


        Return data description'
      non_table_after: ''
    is_folder: false
  routes.assets.new_asset:
    url: '{api_base_url}/assets/'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - name
        - String
        - Required
        - The new name of the Asset.
      - - hoursPerWeek
        - Integer
        - Optional
        - The new hours of operation per week for this Asset. Use -1 to disable this
          feature.
      - - parentAssetID
        - Int
        - Optional
        - The asset's parent. This makes it so assets can be nested in the web application.
      - - locationID
        - Int
        - Required
        - The ID of the location this asset is located at.
      - - geoLocation
        - geoJSON
        - Optional
        - The geoJSON Feature object that can be used to locate an asset on a Map.
      non_table_before: This request creates a new blank Asset.
      non_table_after: ''
    is_folder: false
  routes.assets.patch_asset:
    url: '{api_base_url}/assets/:assetID/'
    method: PATCH
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - name
        - String
        - Optional
        - The new name of the Asset.
      - - hoursPerWeek
        - Integer
        - Optional
        - The new hours of operation per week for this Asset. Use -1 to disable this
          feature and have it default to the Locations hours of operation.
      - - parentAssetID
        - Int
        - Optional
        - The asset's parent. This must be another asset ID and is used to display
          an Asset hierarchy. You can not have assets be their own ancestor.
      - - startedOn
        - Int
        - Optional
        - The new date this Asset was created. Must be a unixtimestamp.
      - - geoLocation
        - geoJSON
        - Optional
        - The geoJSON Feature object that can be used to locate an asset on a Map.
          To remove geoLocation from an Asset pass an empty object ( {}).
      non_table_before: This request updates an Asset's top level information. See
        Update Asset Field Value to update an Asset Field's value.
      non_table_after: ''
    is_folder: false
  routes.assets.delete_asset:
    url: '{api_base_url}/assets/1'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This request removes an Asset from your Limble account.
      non_table_after: ''
    is_folder: false
  routes.assets.move_asset_to_another_location:
    url: '{api_base_url}/assets/:assetID/move'
    method: PATCH
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - locationID
        - Int
        - Required
        - The locationID of the location the asset needs to be moved to.
      - - transferParts
        - boolean
        - Optional
        - A boolean representing whether parts associated with the asset should be
          moved to the location as well.Defaults to true.
      non_table_before: 'This request moves an existing asset from it''s current location
        to another location. An parent asset that has one or more children assets
        cannot be moved.


        A child asset can be moved and will be created as a top level asset in the
        other location.'
      non_table_after: ''
    is_folder: false
  routes.locations:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.locations.locations:
    url: '{api_base_url}/locations/'
    method: GET
    description_data:
      headers:
      - Property
      - Description
      data_rows:
      - - name
        - The name of the Location
      - - regionID
        - The ID of the region the Location is part of. A regionID of 0 means the
          location is not a part of any region.
      - - timezone
        - The Timezone the location is set at.List of Timezones
      - - weeklyOperationHours
        - The number of hours your Assets run at this location per week. This is used
          to help calculate MTBF.
      - - workRequestPortal
        - This is a URL you can use to submit Work Requests to this Location.
      - - geoLocation
        - The location of a Limble location on a Map.
      - - currencyCode
        - The ISO code for the currency at this location.
      non_table_before: 'This request returns your Locations in Limble.


        **Note:** this endpoint supports pagination. Please refer to the [**Pagination**](https://desktop.postman.com/?desktopVersion=9.31.0&userId=16480856&teamId=206430)
        section for more information.


        **Note:** this endpoint supports pagination. Please refer to the [Pagination](https://desktop.postman.com/?desktopVersion=9.31.0&userId=16480856&teamId=206430)
        section for more information.


        EndFragment


        **Return data description**'
      non_table_after: ''
    is_folder: false
  routes.locations.new_location:
    url: '{api_base_url}/locations'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - name
        - String
        - Required
        - The new name of the Location.
      - - timezone
        - string
        - Required
        - The timezone this location resides in. This accepts a standard tz database
          name, see here.
      - - phone
        - string
        - Required
        - The phone number associated with this location.
      - - weeklyOperationHours
        - Int
        - Optional
        - The hours per week this location operates.
      - - address
        - string
        - Optional
        - The physical address of this location.
      - - address2
        - string
        - Optional
        - The physical address of this location.
      - - geoLocation
        - geoJSON
        - Optional
        - The geoJSON Feature object that can be used to locate a Limble location
          on a Map.
      - - extraNotificationsEmail
        - string
        - Optional
        - Include an email address to receive notifications for the location.
      - - currencyCode
        - string
        - Optional
        - 'The ISO code for the currency at this location. For example: "USD".'
      non_table_before: 'This request creates a new Location.


        **Body parameter descriptions**'
      non_table_after: ''
    is_folder: false
  routes.locations.update_location:
    url: '{api_base_url}/locations/:locationID'
    method: PATCH
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - name
        - String
        - Optional
        - The new name of the Location.
      - - timezone
        - string
        - Optional
        - The timezone this location resides in. This accepts a standard tz database
          name, see here.
      - - phone
        - string
        - Optional
        - The phone number associated with this location.
      - - weeklyOperationHours
        - Int
        - Optional
        - The number of hours your Assets run at this location per week. This is used
          to help calculate MTBF.
      - - address
        - string
        - Optional
        - The physical address of this location.
      - - address2
        - string
        - Optional
        - The physical address of this location.
      - - geoLocation
        - geoJSON
        - Optional
        - The geoJSON Feature object that can be used to locate a Limble location
          on a Map.To remove geoLocation from a Limble Location pass an empty object
          ( {}).
      - - currencyCode
        - string
        - Optional
        - 'The ISO code for the currency at this location. For example: "USD".'
      non_table_before: 'This request updates a Location.


        **Body parameter descriptions**'
      non_table_after: ''
    is_folder: false
  routes.locations.delete_location:
    url: '{api_base_url}/locations/:locationID'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This request removes a Location from your Limble account.  This
        will also remove everything else at this locaiton including Assets, Parts,
        Tasks, etc.  Be VERY careful using this call.
      non_table_after: ''
    is_folder: false
  routes.parts:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.parts.images:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.parts.images.add_part_image:
    url: '{api_base_url}/parts/:partID/image'
    method: PUT
    description_data:
      headers: []
      data_rows: []
      non_table_before: This request adds the main image for a Part.
      non_table_after: ''
    is_folder: false
  routes.parts.images.delete_part_image:
    url: '{api_base_url}/parts/:partID/image'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This request removes the main image from a Part.
      non_table_after: ''
    is_folder: false
  routes.parts.categories:
    is_folder: true
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
  routes.parts.categories.create_part_category:
    url: '{api_base_url}/parts/categories/'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - name
        - string
        - Required
        - The name of your new part category (i.e. "Lawn Mower Parts")
      non_table_before: Creates a part category to help you organize your parts.
      non_table_after: ''
    is_folder: false
  routes.parts.categories.get_categories:
    url: '{api_base_url}/parts/categories/'
    method: GET
    description_data:
      headers: []
      data_rows: []
      non_table_before: ''
      non_table_after: ''
    is_folder: false
  routes.parts.categories.update_part_category:
    url: '{api_base_url}/parts/categories/:categoryID'
    method: PATCH
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - name
        - string
        - Required
        - The name of your new part category (i.e. "Filters")
      non_table_before: This request updates a Part Category's name.
      non_table_after: ''
    is_folder: false
  routes.parts.categories.delete_part_category:
    url: '{api_base_url}/parts/categories/:categoryID'
    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: This request will remove the Part Category from all Parts
        and from possible Categories.
      non_table_after: ''
