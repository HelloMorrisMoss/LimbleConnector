    method: DELETE
    description_data:
      headers: []
      data_rows: []
      non_table_before: "Deletes a custom status and reassigns all tasks using it.\
        \ Default statuses (0, 1, 2) cannot be deleted.\n\n**IMPORTANT NOTE:** Deleting\
        \ task statuses that are currently in use will result in all tasks assigned\
        \ that status being reset to status 0 (open).\n\n**Path Parameters:**\n\n\
        - `statusID` (number, required) - ID of the status to delete\n    \n\n**Query\
        \ Parameters:**\n\n- `replacementStatusID` (number, required) - ID of the\
        \ status to assign to tasks currently using the deleted status. Can be a default\
        \ status (0, 1, 2) or another custom status.\n    \n\n**Validation:**\n\n\
        - Cannot delete default statuses (IDs 0, 1, 2)\n    \n- Both statusID and\
