  routes.statuses.create_status:
    url: '{api_base_url}/statuses'
    method: POST
    description: "Creates a new custom status for the customer account.\n\n**Request\
      \ Body:**\n\n- `name` (string, required) - Status name, 1-100 characters, must\
      \ be unique (case-insensitive)\n    \n- `description` (string, optional) - Status\
      \ description, max 65535 characters\n    \n- `sortOrder` (integer, optional)\
      \ - Display order, 0-99, auto-assigned if omitted\n    \n\n**Response (201 Created):**\n\
      \n- `statusID` (number) - ID of the newly created status\n    \n- Location header:\
      \ `/v2/statuses?statuses={statusID}`\n    \n\n**Validation:**\n\n- Name must\
      \ not conflict with existing statuses or defaults (\"Open\", \"In Progress\"\
      , \"Complete\")\n    \n- Name is compared case-insensitively"
  routes.statuses.update_status:
    url: '{api_base_url}/statuses/:statusID'
    method: PATCH
    description: "Updates an existing custom status. Default statuses (0, 1, 2) cannot\
      \ be modified.\n\n**IMPORTANT NOTE:** Changes to statuses automatically propogate\
      \ to all tasks currently assigned that status.\n\n**Path Parameters:**\n\n-\
      \ `statusID` (number, required) - ID of the status to update\n    \n\n**Request\
      \ Body (at least one field required):**\n\n- `name` (string, optional) - New\
      \ status name, 1-100 characters, must be unique\n    \n- `description` (string,\
      \ optional) - New description, max 65535 characters\n    \n- `sortOrder` (integer,\
      \ optional) - New display order, 0-99\n    \n\n**Validation:**\n\n- Cannot modify\
      \ default statuses (IDs 0, 1, 2)\n    \n- If changing name, must not conflict\
      \ with existing statuses\n    \n- Status must exist and belong to the customer"
  routes.statuses.delete_status:
    url: '{api_base_url}/statuses/:statusID?replacementStatusID=1'
    method: DELETE
    description: "Deletes a custom status and reassigns all tasks using it. Default\
      \ statuses (0, 1, 2) cannot be deleted.\n\n**IMPORTANT NOTE:** Deleting task\
      \ statuses that are currently in use will result in all tasks assigned that\
      \ status being reset to status 0 (open).\n\n**Path Parameters:**\n\n- `statusID`\
      \ (number, required) - ID of the status to delete\n    \n\n**Query Parameters:**\n\
      \n- `replacementStatusID` (number, required) - ID of the status to assign to\
      \ tasks currently using the deleted status. Can be a default status (0, 1, 2)\
