  routes.parts.create_part:
    url: '{api_base_url}/parts/'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - locationID
        - Int
        - Required
        - The location of the Part to be updated. Must be the Location's unique ID
          number.
      - - name
        - String
        - Required
        - The new name of the Part.
      - - number
        - String
        - Optional
        - The new number of the Part.
      - - generalStock
        - number
        - Optional
        - How many of this Part are now in stock. Not including purchase orders
      - - generalPrice
        - number
        - Optional
        - The new price of the Part. Not considering purchase order prices.
      - - unitCode
        - String
        - Optional
        - The unit code to assign to the part. If the unit code is not found, the
          request will return a 404 error.
      - - supplier
        - String
        - Optional
        - The new supplier of the Part.
      - - location
        - String
        - Optional
        - The new location of the Part (i.e. bin).
      - - categoryID
        - int
        - Optional
        - The category this part is in. (i.e. Electronics).
      - - staleThreshold
        - Int
        - Optional
        - The Stale Threshold setting allows you to set how many days need to go by
          without a Work Order or Task using this Part. For example, if the Stale
          Threshold is set at 30 and a Part does not get used by a Work Order or Task
          within 30 days, then the Part clock indicator will change color to red.
          If you wish to turn off this feature, assign a value of -1.
      - - minQtyThreshold
        - Int
        - Optional
        - The Minimum Part Qty Threshold setting allows you to set a limit on how
          low you want this Part's qty to get. For example, if a Part Qty is lower
          than the Part Qty Threshold, a Task will be assigned to the Manager of the
          location to order new Parts. If you wish to turn off this feature, assign
          a value of -1.
      - - maxQtyThreshold
        - Int
        - Optional
        - The Max Part Quantity Threshold number is used to determine what level you
          would like to bring your stock back to when you need to reorder a part.
          For example if I have 4 parts and my Maximum Part Qty Threshold is set to
          20, I will have a task letting me know to order 16 more parts. If you wish
          to disable this feature please have a value of -1 entered.
      - - minQtyStatus
        - Boolean
        - Optional
        - This indicates if you are understocked or not.
      - - staleStatus
        - Boolean
        - Optional
        - This indicates if the part has gone stale or not. This value cannot be changed
          by regular user interaction it is change automatically by limble.
      - - assignment
        - Int
        - Optional. Required if 'assignmentType' is used.
        - The user or team to which the task will be assigned.Must be a user or team
          that exists at the specified location. Must be the unique ID number of the
          user or team. If this parameter is set, the assignmentType parameter must
          also be set.
      - - assignmentType
        - Enum
        - Optional. Required if 'assignment' is used.
        - Specifies wether this task will be assigned to a 'user' or a 'team'. Those
          two strings are the only accepted input. If this parameter is set, the assignment
          parameter must also be set.
      non_table_before: This request adds new Parts to inventory list.
      non_table_after: ''
    is_folder: false
