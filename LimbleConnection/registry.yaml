version: '1.0'
endpoints:
  routes.me.me:
    url: '{api_base_url}/me'
    method: GET
    description: 'Identifies the current customer. This route can be used to test
      that authentication to the Limble API was successful.


      <p><b>Return data description</b></p>


      <table><tbody><tr><th>Property</th><th>Description</th></tr><tr><td><div>customerName</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      name of the customer that your API keys are valid for.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>customerPlan</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      Limble plan the customer is currently subscribed to. The customerPlan can have
      one of following values:<br><br>starter<br>professional<br>business<br>enterprise<br>legacy
      - The plan the customer is currently subscribed to has been deprecated.<br><br>For
      more information about various plans please visit the <a rel="noreferrer noopener
      nofollow" href="https://limblecmms.com/pricing/" target="_blank" url="https://limblecmms.com/pricing/">Limble</a>
      website.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr></tbody></table>'
  routes.assets.image.add_asset_main_image:
    url: '{api_base_url}/assets/:assetID/image'
    method: PUT
    description: Each asset can have one main image associated with it.  This request
      allows you to set that image.
  routes.assets.image.delete_asset_main_image:
    url: '{api_base_url}/assets/:assetID/image'
    method: DELETE
    description: This request removes the main image from the asset.
  routes.assets.fields.asset_fields:
    url: '{api_base_url}/assets/fields/?assets=171'
    method: GET
    description: 'This request gets detailed information about asset fields such as
      Make, Model and any other custom field.


      This call also returns "files" which is an array of objects that have a file
      name and a link you can use to download that file. All links are only valid
      for 15 minutes, a new call will generate a new link.


      **Note:** this endpoint supports pagination. Please refer to the [**Pagination**](#pagination)
      section for more information.'
  routes.assets.fields.asset_suggested_fields:
    url: '{api_base_url}/assets/fields/suggested'
    method: GET
    description: "This request gets all possible fields an Asset can pick from when\
      \ deciding which fields it should have.  \n\nTo understand this concept, let's\
      \ pretend you have the following assets:  \n\nYour first Asset (a Truck) has\
      \ the fields Make, Model, and VIN.  \n\nYour second Asset (a HVAC) has the fields\
      \ Make, Model, and Serial Number.  \n\nThis would mean there are 4 suggested\
      \ fields that exist:  Make, Model, VIN and Serial Number.  If I added a third\
      \ new asset I could pick from any of the 4 suggested fields.\n\nSuggested fields\
      \ are the full list of possible fields that can be added to assets at that location."
  routes.assets.fields.asset_field_history:
    url: '{api_base_url}/assets/fields/history'
    method: GET
    description: "Any time an Asset's field is changed an entry is inserted into a\
      \ history.  \n\nThis request allows you to pull that information so you can\
      \ see trends over time."
  routes.assets.fields.new_asset_suggested_field:
    url: '{api_base_url}/assets/fields/'
    method: POST
    description: "This request creates a new Suggested Field.\n\nSuggested Fields\
      \ are the full list of possible Fields that can be added to Assets at that Location.\n\
      \n<table class=\"apiTable\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Parameter</th>\n\
      \t\t\t<th>Type</th>\n\t\t\t<th>Required?</th>\n\t\t\t<th>Description</th>\n\t\
      \t</tr>\n\t</thead>\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>locationID</td>\n\t\t\t\
      <td>Int</td>\n\t\t\t<td>Required</td>\n\t\t\t<td>The location ID of the Asset\
      \ to add the new Field to.</td>\n\t\t</tr>\n\t\t<tr class=\"even\">\n\t\t\t\
      <td>name</td>\n\t\t\t<td>String</td>\n\t\t\t<td>Required</td>\n\t\t\t<td>The\
      \ name of the new Field. <b>Some custom field names such as \"Asset\" are not\
      \ allowed and reserved for internal use. This will result in a 409 error.</b></td>\n\
      \t\t</tr>\n\t\t<tr>\n\t\t\t<td>fieldType</td>\n\t\t\t<td>Int</td>\n\t\t\t<td>Required</td>\n\
      \t\t\t<td>The type of the new Field. You can choose from Text (1), Date (2),\
      \ Pictures (3), Documents (4), Number (5),\n\t\t\t\tCurrency (6).</td>\n\t\t\
      </tr>\n\t</tbody>\n</table>"
  routes.assets.fields.update_asset_field_value:
    url: '{api_base_url}/assets/fields/:valueID/'
    method: PATCH
    description: "This request updates the value of a Field that is attached to an\
      \ Asset.  \n\n<table class=\"apiTable\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Parameter</th>\n\
      \t\t\t<th>Type</th>\n\t\t\t<th>Required?</th>\n\t\t\t<th>Description</th>\n\t\
      \t</tr>\n\t</thead>\n\t<tbody>\n\t\t<tr class=\"even\">\n\t\t\t<td>value</td>\n\
      \t\t\t<td>Varies depending on the Field's type</td>\n\t\t\t<td>Required</td>\n\
      \t\t\t<td>The value that will be written to the field, overwriting the previous\
      \ value and creating an entry in the field history.  \"value\" must correspond\
      \ to the fieldType of the field. For example, if the field is a \"number\" fieldType,\
      \ then \"value\" must be a number.\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>"
  routes.assets.fields.attach_field_to_asset:
    url: '{api_base_url}/assets/:assetID/fields'
    method: PUT
    description: "This request attaches a Suggested Field to an Asset. The field and\
      \ asset must belong to the same location.\n\nFor example, let's say I have an\
      \ Asset called Truck - 001.  This Truck doesn't have any Fields attached to\
      \ it, but I want to track its Make so I can set that this Truck is a Dodge.\
      \  This is the request I would use to attach the Make Field to the Truck and\
      \ then I would use the Update Asset Field Value request to set it to Dodge.\n\
      \n\n<table class=\"apiTable\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Parameter</th>\n\
      \t\t\t<th>Type</th>\n\t\t\t<th>Required?</th>\n\t\t\t<th>Description</th>\n\t\
      \t</tr>\n\t</thead>\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>locationID</td>\n\t\t\t\
      <td>Int</td>\n\t\t\t<td>Required</td>\n\t\t\t<td>The ID of the Location the\
      \ Asset exists at.</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>fieldID</td>\n\t\t\t\
      <td>Int</td>\n\t\t\t<td>Required</td>\n\t\t\t<td>The ID of the existing Field\
      \ to add to the Asset.</td>\n\t\t</tr>\n\t</tbody>\n</table>"
  routes.assets.fields.delete_asset_field:
    url: '{api_base_url}/assets/fields/:valueID'
    method: DELETE
    description: This request deletes a field attached to an Asset.
  routes.assets.logs.files.delete_asset_log_file:
    url: '{api_base_url}/assets/logs/file/:fileID'
    method: DELETE
    description: This requests deletes a file attached to a log.
  routes.assets.logs.files.add_asset_log_file:
    url: '{api_base_url}/assets/:assetID/logs/:logID/file'
    method: PUT
    description: 'This request adds files to a log.


      <p><b>Return data description</b></p>


      <table><tbody><tr><th>Property</th><th>Description</th></tr><tr><td>fileID</td><td>The
      ID of the file attached to the log.</td></tr></tbody></table>'
  routes.assets.logs.asset_logs:
    url: '{api_base_url}/assets/:assetID/logs'
    method: GET
    description: 'This request returns logs created manually by users and automatically
      created (where userID=0) by certain actions taken on the asset. Logs related
      to tasks completed on an Asset will not be returned.


      **Note:** this endpoint supports pagination. Please refer to the [**Pagination**](#pagination)
      section for more information.


      <p><b>Return data description</b></p>


      <table><tbody><tr><th>Property</th><th>Description</th></tr><tr><td>logID</td><td>The
      unique logID of the log.</td></tr><tr><td>dateCreated</td><td>The date the log
      was created as a UNIX timestamp.</td></tr><tr><td>assetD</td><td>The ID of the
      asset the log belongs to.</td></tr><tr><td>logEntry</td><td>The log entry for
      the asset.</td></tr><tr><td>userID</td><td>The ID of the user that created the
      log.</td></tr><tr><td>logFiles</td><td>An array of objects that have a fileID,
      fileName and a link that can used to download the files attached to the log.
      All links are only valid for 15 minutes, a new call will generate a new link.</td></tr></tbody></table>'
  routes.assets.logs.new_asset_log:
    url: '{api_base_url}/assets/:assetID/logs'
    method: POST
    description: 'This requests creates a manual log entry for an asset.


      <table><tbody><tr><th>Parameter</th><th>Type</th><th>Required?</th><th>Description</th></tr><tr><td>userID</td><td>Int</td><td>Optional</td><td>The
      ID of the user creating the log. If userID is not given a log entry with userID=0
      will be created.</td></tr><tr><td>logEntry</td><td>String</td><td>Required</td><td>Details
      of the log.</td></tr></tbody></table>'
  routes.assets.logs.update_asset_log:
    url: '{api_base_url}/assets/logs/:logID'
    method: PATCH
    description: This requests updates a manual log entry for an asset.
  routes.assets.logs.delete_asset_log:
    url: '{api_base_url}/assets/logs/:logID'
    method: DELETE
    description: This requests deletes a manual log entry for an asset.
  routes.assets.batch.batch_update_asset_fields:
    url: '{api_base_url}/assets/fields/batch/update'
    method: POST
    description: 'This request will update multiple asset fields values at a time.
      The request expects an array of asset fields values. The array needs to have
      atleast two asset field values and atmost 100 asset field values. The request
      expects an array made up of asset field values that need to be updated. Only
      asset fields values of type Text (1), Date (2), Number (5) and Currency (6)
      can be updated using this request.


      The response returns `{ sucess:true }` if all field values are updated successfully.
      The response returns `{ sucess: false }` and an `updates` array that gives details
      of which field values were updated and the `reason` for field values that were
      not updated successfully. Please refer to the examples for more information.


      <table><tbody><tr><th>Parameter</th><th>Type</th><th>Required?</th><th>Description</th></tr><tr><td>valueID</td><td>Integer</td><td>Required</td><td>The
      valueID of the asset field value</td></tr><tr><td>value</td><td>Based on the
      type of value</td><td>Required</td><td>The value that needs to be updated</td></tr></tbody></table>'
  routes.assets.parts.asset_parts:
    url: '{api_base_url}/assets/parts'
    method: GET
    description: 'This request returns a list of Part Asset Relations with top level
      information such as part, asset, qty, last edited, etc.


      **Note:** this endpoint supports pagination. Please refer to the [<b>Pagination</b>](#pagination)
      section for more information.


      <p><b>Return data description</b></p>


      <table><tbody><tr><th>Property</th><th>Description</th></tr><tr><td><div>relationID</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      Relations ID. e.g. 1</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>partID</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      ID of the Part in this Relation</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>assetID</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      ID of the Asset in this Relation</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>qty</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      qty of the Part related to this Asset</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>createdAt</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      unix timestamp at which this Relation was created</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>lastEdited</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      unix timestamp at which this Relation last saw a change</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>associationType</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      method used to create this Relation. At this time, only "manual" is supported</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr></tbody></table>'
  routes.assets.assets:
    url: '{api_base_url}/assets/'
    method: GET
    description: 'This request returns a list of Assets with top level information
      such as name, last edited, etc.


      **Note:** this endpoint supports pagination. Please refer to the [<b>Pagination</b>](#pagination)
      section for more information.


      <p><b>Return data description</b></p>


      <p><br><br></p><p><br><br><br></p><table><tbody><tr><th>Property</th><th>Description</th></tr><tr><td><div>meta</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>Requests
      to gather more information on an Asset such as Fields for the Asset or what
      Tasks are assigned to the Asset</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>startedOn</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      date when this Asset was started on. This property is used to help determine
      runtime which is used in MTBF.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>lastEdited</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>A
      UNIX timestamp of when this Asset was last edited.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>parentAssetID</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      Asset that is the parent of this Asset. If the value is 0 that means this Asset
      does not have a parent.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>locationID</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      ID of the location this asset is located at.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>hoursPerWeek</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      number of hours this Asset runs per week. This is used to determine runtime
      which is used in MTBF. If the value is -1 then the Asset uses the Location''s
      hoursPerWeek setting.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>workRequestPortal</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      url work requestors can use to submit problems with this Asset.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>image</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>Array
      of objects that have a file name and a link you can use to download that image.
      All links are only valid for 15 minutes, a new call will generate a new link.</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>geoLocation</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      location of an asset on a Map.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr></tbody></table>'
  routes.assets.new_asset:
    url: '{api_base_url}/assets/'
    method: POST
    description: "This request creates a new blank Asset.\n\n<table class=\"apiTable\"\
      >\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Parameter</th>\n\t\t\t<th>Type</th>\n\t\t\t\
      <th>Required?</th>\n\t\t\t<th>Description</th>\n\t\t</tr>\n\t</thead>\n\t<tbody>\n\
      \t\t<tr>\n\t\t\t<td>name</td>\n\t\t\t<td>String</td>\n\t\t\t<td>Required</td>\n\
      \t\t\t<td>The new name of the Asset.</td>\n\t\t</tr>\n\t\t<tr class=\"even\"\
      >\n\t\t\t<td>hoursPerWeek</td>\n\t\t\t<td>Integer</td>\n\t\t\t<td>Optional</td>\n\
      \t\t\t<td>The new hours of operation per week for this Asset. Use -1 to disable\
      \ this feature.</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>parentAssetID</td>\n\t\t\
      \t<td>Int</td>\n\t\t\t<td>Optional</td>\n\t\t\t<td>The asset's parent. This\
      \ makes it so assets can be nested in the web application</u></a>.</td>\n\t\t\
      </tr>\n\t\t<tr>\n\t\t\t<td>locationID</td>\n\t\t\t<td>Int</td>\n\t\t\t<td>Required</td>\n\
      \t\t\t<td>The ID of the location this asset is located at.</u></a></td>\n\t\t\
      </tr>\n<tr>\n\t\t\t<td>geoLocation</td>\n\t\t\t<td>geoJSON</td>\n\t\t\t<td>Optional</td>\n\
      \t\t\t<td>The <a href=\"https://geojson.org\">geoJSON</a> Feature object that\
      \ can be used to locate an asset on a Map.</u></a></td>\n\t\t</tr>\n\t</tbody>\n\
      </table>"
  routes.assets.patch_asset:
    url: '{api_base_url}/assets/:assetID/'
    method: PATCH
    description: 'This request updates an Asset''s top level information. See Update
      Asset Field Value to update an Asset Field''s value.


      <p><br><br></p><p><br><br><br></p><table><tbody><tr><th>Parameter</th><th>Type</th><th>Required?</th><th>Description</th></tr><tr><td>name</td><td>String</td><td>Optional</td><td>The
      new name of the Asset.</td></tr><tr><td>hoursPerWeek</td><td>Integer</td><td>Optional</td><td>The
      new hours of operation per week for this Asset. Use -1 to disable this feature
      and have it default to the Locations hours of operation.</td></tr><tr><td>parentAssetID</td><td>Int</td><td>Optional</td><td>The
      asset''s parent. This must be another asset ID and is used to display an Asset
      hierarchy. You can not have assets be their own ancestor.</td></tr><tr><td>startedOn</td><td>Int</td><td>Optional</td><td>The
      new date this Asset was created. Must be a <a href="https://www.unixtimestamp.com">unix<br>timestamp</a>.</td></tr><tr><td>geoLocation</td><td>geoJSON</td><td>Optional</td><td>The
      <a href="https://geojson.org">geoJSON</a> Feature object that can be used to
      locate an asset on a Map. To remove geoLocation from an Asset pass an empty
      object ( <code>{}</code>).</td></tr></tbody></table>'
  routes.assets.delete_asset:
    url: '{api_base_url}/assets/1?assetID={{assetID}}'
    method: DELETE
    description: This request removes an Asset from your Limble account.
  routes.assets.move_asset_to_another_location:
    url: '{api_base_url}/assets/:assetID/move'
    method: PATCH
    description: 'This request moves an existing asset from it''s current location
      to another location. An parent asset that has one or more children assets cannot
      be moved.


      A child asset can be moved and will be created as a top level asset in the other
      location.


      <table><tbody><tr><th>Parameter</th><th>Type</th><th>Required?</th><th>Description</th></tr><tr><td><div>locationID</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>Int</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>Required</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      locationID of the location the asset needs to be moved to.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>transferParts</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>boolean</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>Optional</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>A
      boolean representing whether parts associated with the asset should be moved
      to the location as well.<br><br>Defaults to true.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr></tbody></table>'
  routes.locations.locations:
    url: '{api_base_url}/locations/'
    method: GET
    description: 'This request returns your Locations in Limble.


      **Note:** this endpoint supports pagination. Please refer to the [**Pagination**](https://desktop.postman.com/?desktopVersion=9.31.0&userId=16480856&teamId=206430)
      section for more information.


      **Note:** this endpoint supports pagination. Please refer to the [<b>Pagination</b>](https://desktop.postman.com/?desktopVersion=9.31.0&userId=16480856&teamId=206430)
      section for more information.


      EndFragment


      **Return data description**


      <table><tbody><tr><th>Property</th><th>Description</th></tr><tr><td><div>name</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      name of the Location</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>regionID</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      ID of the region the Location is part of. A regionID of 0 means the location
      is not a part of any region.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>timezone</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      Timezone the location is set at.<a rel="noreferrer noopener nofollow" href="https://www.php.net/manual/en/timezones.php"
      target="_blank" url="https://www.php.net/manual/en/timezones.php">List of Timezones</a></div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>weeklyOperationHours</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>The
      number of hours your Assets run at this location per week. This is used to help
      calculate MTBF.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>workRequestPortal</div><div
      contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>This
      is a URL you can use to submit Work Requests to this Location.</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr><tr><td><div>geoLocation</div><div
