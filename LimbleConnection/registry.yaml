  routes.units_of_measure.get_units:
    url: '{api_base_url}/uom'
    method: GET
    description: 'This endpoint makes an HTTP GET request to retrieve the unit of
      measurement (UOM) data. The response of this request is documented as a JSON
      schema.


      <p><b>Return data description</b></p>


      | **Property** | **Description** |

      | --- | --- |

      | unitCode | The identifier of this unit of measure. It is some random text
      for custom units (e.g. `j5VEKvW-TD8femkRe02KV`) and it is something semantic
      for provided units (e.g. `fluid_ounce`) |

      | name | The full name of a unit to make it clear what it is. |

      | abbreviation | The abbreviated name of a unit that is used for compact formatting
      such as `fl oz`. Can override the default abbreviation of a provided unit. E.g.
      if the default abbreviation of fluid ounce is `fl oz`, you can make it `oz.`
      |

      | defaultAbbreviation | This is always the same as abbreviation for custom units.
      For provided units, this never changes. If you choose to alias the abbreviation,
      this will show the original, and the abbreivation property will be your alias.
      |

      | category | Also known as the "physical quantity" of a unit, which tells you
      what exactly this is measuring. The possibilities are `volume`, `weight`, `length`,
      `count`. All custom units will have the category of `count`, as there is no
      way to setup custom conversion rates. |

      | isCustom | Boolean which tells you if this is a custom unit or provided unit.
      |'
  routes.units_of_measure.create_unit:
    url: '{api_base_url}/uom'
    method: POST
    description: "The `POST /v2/uom` endpoint is used to create a new custom unit.\
      \ The request should include a JSON payload with the `name` and `abbreviation`\
      \ fields.\n\n### Request Body\n\n- `name` (string): The full name of the unit.\n\
      \    \n- `abbreviation` (string): A compact name of the unit.\n    \n\n### Response\n\
      \nThe full unit object of your newly created unit."
  routes.units_of_measure.update_unit:
    url: '{api_base_url}/uom/:unitCode'
    method: PATCH
    description: "The HTTP PATCH request is used to update a specific unit identified\
      \ by its unit code. The request should be made to the endpoint `{{protocol}}://{{server}}:{{port}}/v2/uom/:unitCode`,\
      \ where `:unitCode` is the unique identifier of the unit being updated.\n\n\
      ### Request Body\n\nThe body is interpreted slightly differently, depending\
      \ on whether the `unitCode` in the url is for a custom unit or a provided unit.\
      \ If it is custom, then either property can be used to update the unit. If it\
      \ is a provided unit, the `name` property will be ignored and only the `abbreviation`\
      \ property will be used to override the defaut one. You can also use `null`\
      \ to remove the override from the provided unit. If either property is `null`\
      \ for a custom unit, that property will not be updated.\n\nThe request should\
      \ include a JSON payload with the following parameters:\n\n- `name` (string):\
      \ The full name of the unit.\n    \n- `abbreviation` (string): A compact name\
      \ of the unit.\n    \n\n### Response\n\nThe full object of the updated unit."
