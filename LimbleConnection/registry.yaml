          type:1 Check Box - true/false2 Radio List - if no option is selected, this
          will be 0. If an option is selected, this will be a number that maps to
          the itemOptionID of one of the members of the options array.3 Text Box -
          string4 Dropdown Box - if no option is selected, this will be 0. If an option
