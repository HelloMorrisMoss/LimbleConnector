  routes.tasks.work_request_submissions.list_wr_submissions:
    url: '{api_base_url}/work-requests/work-request-submissions'
    method: GET
    description_data:
      non_table_before: 'Lists WR submissions


        Return data description:'
      headers:
      - '**Property**'
      - '**Description**'
      data_rows:
      - - workRequestSubmissionId
        - The unique identifier of the work request submission.
      - - status
        - Pending, Approved or Rejected.
      - - createdByUserId
        - The unique identifier of the user who created the work request submission.
      - - createdAt
        - 'The date the work request submission was created. The timestamp is in the
          following format: YYYY-MM-DD (2025-07-02) HH:MM:SS (21:36:31)'
      - - updatedAt
        - 'The date the work request submission was last updated. The timestamp is
          in the following format: YYYY-MM-DD (2025-07-02) HH:MM:SS (21:36:31)'
      - - deletedAt
        - 'The date the work request submission was deleted. The timestamp is in the
          following format: YYYY-MM-DD (2025-07-02) HH:MM:SS (21:36:31) Will be NULL
          if the submission is not deleted.'
      - - reviewedByUserId
        - The unique identifier of the user who reviewed the submission.
      - - reviewedAt
        - 'The date the work request submission was reviewed. The timestamp is in
          the following format: YYYY-MM-DD (2025-07-02) HH:MM:SS (21:36:31) Will be
          NULL if the submission has not yet been reviewed'
      - - reviewedReason
        - The predefined reason the work request was declined.
      - - additionalNotes
        - Any additional notes the person who declined the submission wishes to leave.
      - - locationId
        - The unique identifier of the location the submission belongs to.
      - - assetId
        - The unique identifier of the asset associated with the submission.
      - - priorityId
        - The unique identifier of the priority of the submission.
      - - dueDateUnit
        - "The unit of measure used to communicate when the task will be due. Can\
          \ be \u201Cdays\u201D or \u201Chours\u201D."
      - - requestInformation
        - The information filled out in the Work Request Portal. Includes any of the
          following fields in JSON format. customerCode requesterName requesterEmail
          requesterPhone timeUnix customTag customFieldOne customFieldTwo customFieldThree
          customFieldOneTitle customFieldTwoTitle customFieldThreeTitle customFieldDropdownAnswerOne
          customFieldDropdownAnswerTwo customFieldDropdownAnswerThree customDropdownTitleOne
          customDropdownTitleTwo customDropdownTitleThree customDropdownOptionsOne
          customDropdownOptionsTwo customDropdownOptionsThree geoLocation
      - - customerID
        - The unique identifier of the customer account.
      - - requestTitle
        - The title of the submission.
      - - assignedToProfileId
        - The Limble profile the submission is assigned to. This is used to determine
          what team or individual is assigned to review the submission.
      - - requestDescription
        - The description of the problem filled out in the Work Request Portal.
      - - checklistID
        - The unique identifier of the task generated from the submission when it
          is approved. Will be NULL if submission status is declined or pending.
      - - requesterName
        - The name of the person who submitted the work request submission.
      non_table_after: ''
    is_folder: false
  routes.tasks.new_task:
    url: '{api_base_url}/tasks'
    method: POST
    description_data:
      headers:
      - Parameter
      - Type
      - Required?
      - Description
      data_rows:
      - - name
        - String
        - Required
        - The name of the Task.
      - - locationID
        - Int
        - Required
        - The id of the Location this Task is assigned to. Must be the Location's
          unique ID number.
      - - due
        - Int
        - Required
        - The time at which the Task is due. Must be a unix timestamp.
      - - type
        - Int
        - Required
        - The type of Task according to this legend:1 = Preventative Maintanance (PM).2
          = Unplanned Work Order (WO);4 = Planned Work Order (WO);6 = Work Request
          (WR).Task types not listed here are not currently supported.If you would
          like another Task type to be supported, please contact us.A taskType of
          6 prevents the user from assigning a batchID.
      - - description
        - string
        - Optional
        - A brief description about the Task.
      - - assetID
        - Int
        - Optional
        - The Asset that the Task will be attached to, if any.Must be the unique ID
          number of the Asset.Omitting this parameter or setting it to zero will not
          attach the Task to an asset.
      - - assignment
        - Int
        - Optional. Required if 'assignmentType' is used.
        - The User or Team to which the Task will be assigned. Must be a User or Team
          that exists at the specified Location. Must be the unique ID number of the
          user or Team. If this parameter is set, the assignmentType parameter must
          also be set.
      - - templateID
        - Int
        - Optional
        - The taskID of the task you wish to utilize as a template when posting a
          new Task. Using this will duplicate all steps in the Template to the newly
          created task. Templates can be easily viewed and built in Limble's web application.
      - - assignmentType
        - Enum
        - Optional. Required if 'assignment' is used.
        - Specifies whether this Task will be assigned to a 'user', 'team' or 'multi'.
          Those two strings are the only accepted input. If this parameter is set,
          the assignment parameter must also be set.
      - - priority
        - Int
        - Optional
        - Specifies the priority of the Task. Must correspond to a 'priorityLevel'
          (See GET Priorities) configured in your in your Limble account.
      - - estimatedTime
        - Int
        - Optional
        - Updates the estimated time of the task. This is the time it takes to complete
